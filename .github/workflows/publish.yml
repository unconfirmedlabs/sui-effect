name: Publish to npm

# Publishes on a version tag (v0.1.0, ...), never on merge, via npm trusted publishing (OIDC).
# One-time setup on npmjs.com after the first publish: Settings -> Trusted
# Publisher -> GitHub Actions, naming this repo and this workflow file.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@11.5.1
      - run: bun install --frozen-lockfile
      - run: bun run check
      - name: Verify tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          [ "$TAG" = "$PKG" ] || { echo "::error::tag $TAG != package.json $PKG"; exit 1; }
      - name: Verify the tarball carries dist and LLMS.md
        run: |
          npm pack --dry-run > /tmp/pack.txt 2>&1
          grep -q 'dist/' /tmp/pack.txt && grep -q 'LLMS.md' /tmp/pack.txt
      # The repository is public, so npm accepts a provenance attestation linking
      # the tarball to this workflow run.
      - run: npm publish --access public --provenance
